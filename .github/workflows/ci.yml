name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      # Dummy DSN so Sentry.init isn't tree-shaken: budget must measure the prod build.
      - run: pnpm build && scripts/bundle-budget.sh
        env: { VITE_SENTRY_DSN: "https://x@o0.ingest.us.sentry.io/0" }
