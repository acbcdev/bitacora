allowBuilds:
  esbuild: true
# Supply-chain hardening: no instalar paquetes publicados hace menos de 3 días
# (malware often gets caught and unpublished within hours).
# 4320 (3 días): @tiptap/extension-table@3.31.3 bloqueado con 4 días, superado.
minimumReleaseAge: 4320
# Política de confianza estricta: rechaza paquetes cuyas señales de confianza
# (provenance, firmas) empeoran entre versiones. trustPolicyIgnoreAfter deja
# pasar los paquetes legacy pre-provenance (ej. semver@6.3.1, de 2023) por edad.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 1576800
# Excepción puntual: transitiva pre-release (fork) marcada como downgrade.
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
